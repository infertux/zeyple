name: Zeyple test and deb package build

on:
  push:
    branches: [master] # pull requests are tested by the pull_request event, don't run twice
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # run weekly on Sundays

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts (debian:trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 mandoc build-essential debhelper dh-python lintian
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build packages, HTML manual and checksums
        # the checkout belongs to the runner's user, not the container's root
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./tools/build-release
      - name: Check Debian packages
        run: lintian --info --display-info --pedantic dist/*.changes
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zeyple-release
          path: ./dist/
          if-no-files-found: error

  test:
    name: ${{ matrix.name }} (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    # Test the same package with each distro's own Python and python3-gpg.
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - name: debian-12
            image: debian:bookworm # Python 3.11
          - name: debian-13
            image: debian:trixie # Python 3.13
          - name: ubuntu-24.04
            image: ubuntu:24.04 # Python 3.12
          - name: ubuntu-26.04
            image: ubuntu:26.04 # Python 3.14
      fail-fast: false
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y debconf-utils
          debconf-set-selections <<< "postfix postfix/main_mailer_type string 'Local only'"
          debconf-set-selections <<< "postfix postfix/mailname string localhost"
          apt-get install -y --no-install-recommends \
            ca-certificates git gnupg python3 python3-gpg \
            pycodestyle python3-pytest python3-pytest-cov mandoc \
            postfix mailutils sudo
        shell: bash
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: zeyple-release
          path: ./dist/
      - name: Verify artifact checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Lint with pycodestyle
        run: pycodestyle --show-pep8 --max-line-length=100 .
      - name: Lint man page
        run: mandoc -Tlint -W warning zeyple/zeyple.8
      - name: Build HTML man page
        run: python3 docs/build-man-html.py > man.html
      - name: Test with pytest
        run: python3 -m pytest --cov=zeyple/ --cov-report=term tests/
      - name: End to end test using the release package
        run: bash -ex ./tests/e2e.sh ./dist/zeyple_*_all.deb
