name: Zeyple test and deb package build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # run weekly on Sundays

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Test against the distro's own Python and python3-gpg, the way Zeyple is deployed
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - name: debian-12
            image: debian:bookworm # Python 3.11
          - name: debian-13
            image: debian:trixie # Python 3.13
          - name: ubuntu-24.04
            image: ubuntu:24.04 # Python 3.12
          - name: ubuntu-26.04
            image: ubuntu:26.04 # Python 3.14
      fail-fast: false
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y debconf-utils
          debconf-set-selections <<< "postfix postfix/main_mailer_type string 'Local only'"
          debconf-set-selections <<< "postfix postfix/mailname string localhost"
          apt-get install -y --no-install-recommends \
            ca-certificates git gnupg python3 python3-gpg \
            pycodestyle python3-pytest python3-pytest-cov mandoc \
            postfix mailutils sudo ruby ruby-dev build-essential
          gem install --no-document fpm
        shell: bash
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint with pycodestyle
        run: pycodestyle --show-pep8 --max-line-length=100 .
      - name: Lint man page
        run: mandoc -Tlint -W warning zeyple/zeyple.8
      - name: Build HTML man page
        run: python3 docs/build-man-html.py > man.html
      - name: Test with pytest
        run: python3 -m pytest --cov=zeyple/ --cov-report=term tests/
      - name: Build deb package
        run: ./fpm/create
      - name: End to end test using deb package
        run: bash -ex ./tests/e2e.sh
      - name: Upload deb package
        uses: actions/upload-artifact@v7
        with:
          name: zeyple-${{ matrix.name }}.deb
          path: ./fpm/zeyple.deb
      - name: Upload HTML man page
        if: matrix.name == 'debian-13'
        uses: actions/upload-artifact@v7
        with:
          name: zeyple-man.html
          path: ./man.html
